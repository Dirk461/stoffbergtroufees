<style>

:root {
  --pearl: #fdfcf8;
  --pearl-2: #f6f2ea;
  --beige: #d8c6a8;
  --beige-deep: #a88d66;
  --olive: #4b5730;
  --olive-deep: #333b20;
  --ink: #141414;
  --ink-soft: #2e2e2b;
  --line: #e2d8c7;

  --display: "Gilda Display", "Cormorant Garamond", Georgia, serif;
  --body: "EB Garamond", "Cormorant Garamond", Garamond, Georgia, serif;

  --measure: 34rem;
  --card: #ffffff;
  --panel: #f1f8e9;
  --mint: #f1f8e9;
  --mint-deep: #dbe9c9;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--pearl) radial-gradient(120% 60% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 70%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.2rem;
  line-height: 1.65;
  color-scheme: light;
  font-weight: 400;
}

h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.12; margin: 0; }
p { margin: 0 0 1em; }
a { color: var(--olive); }
:focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; border-radius: 4px; }

.wrap { width: min(100% - 2.5rem, 40rem); margin-inline: auto; }

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 0;
}
.monogram { font-family: var(--display); font-size: 1.35rem; color: var(--ink); text-decoration: none; }
.monogram span { color: var(--beige-deep); padding: 0 .15em; }

.lang {
  display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card);
}
.lang button {
  font: 500 .85rem/1 var(--body); letter-spacing: .02em;
  border: 0; background: transparent; color: var(--ink-soft);
  padding: .55rem .85rem; border-radius: 999px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--mint); color: var(--olive-deep); box-shadow: inset 0 0 0 1px var(--mint-deep); }

/* Watercolour of the chapel and the Langeberg */
.scene { display: block; width: calc(100% + 1.5rem); max-width: none; height: auto; aspect-ratio: 960 / 619; margin: .25rem -.75rem 0; animation: scene-in 1.2s ease-out both; }
@keyframes scene-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scene { animation: none; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  font: 500 1.1rem/1 var(--body);
  padding: 1rem 1.4rem; border-radius: 999px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--mint-deep); background: var(--mint); color: var(--olive-deep);

}
.btn:hover { background: #e6f1d9; border-color: #cddfb6; }
.btn.ghost { background: transparent; color: var(--olive-deep); border-color: var(--beige); }
.btn.ghost:hover { background: var(--pearl-2); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn svg { width: 1.1em; height: 1.1em; flex: none; }

.footer {
  text-align: center; color: var(--ink-soft); font-size: .92rem;
  padding: 3rem 0 3.5rem;
}
.footer button {
  font: inherit; color: var(--olive); background: none; border: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; padding: .25rem;
}

  /* ---------- Save the date ---------- */
  .hero { text-align: center; padding: .5rem 0 3.5rem; }
  .dear { font-family: var(--display); font-size: 1.6rem; color: var(--olive-deep); margin: 1.75rem 0 .25rem; }

  .date i { width: .14em; height: .14em; border-radius: 50%; align-self: center; flex: none;

  /* ---------- Venue ---------- */
  .place {

    border-radius: 2rem; padding: 2.25rem 1.5rem;

  .place h2 { font-size: 1.15rem; font-family: var(--body); font-style: italic; color: var(--olive); letter-spacing: .03em; margin-bottom: .75rem; }
  .place h3 { font-size: clamp(2.2rem, 9vw, 3rem); margin-bottom: .2rem; }

  .place .actions { justify-content: flex-start; margin-top: 1.5rem; }

  .later { color: var(--ink-soft); margin: 1.5rem .25rem 0; max-width: var(--measure); }

  /* ---------- RSVP ---------- */
  .rsvp { margin-top: 3.5rem; padding: 2.25rem 1.5rem; background: var(--card); border: 1px solid var(--line); border-radius: 2rem; }
  .rsvp h2 { font-size: clamp(2rem, 8vw, 2.6rem); margin-bottom: .5rem; color: var(--olive); }

  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 3rem; padding: .6rem; border-radius: 999px; cursor: pointer;

  .choice input:checked + label { background: var(--mint); border-color: var(--mint-deep); color: var(--olive-deep); }
  .choice input.no:checked + label { background: var(--beige); border-color: var(--beige); color: var(--ink); }
  .choice input:focus-visible + label { outline: 2px solid var(--olive); outline-offset: 3px; }
  .field { display: block; margin-top: 1rem; }
  .field span { display: block; font-size: .92rem; font-weight: 500; color: var(--ink); margin-bottom: .35rem; }
  .field input, .field textarea {
    width: 100%; font: inherit; color: var(--ink);
    padding: .8rem 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--pearl);
  }
  .field textarea { min-height: 6rem; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--olive); box-shadow: 0 0 0 3px rgba(94,107,58,.15); }
  .extras { border-top: 1px solid var(--line); margin-top: .5rem; padding-top: .5rem; }
  .error { color: #8f3f2f; margin: 1rem 0 0; }
  .submit { margin-top: 1.5rem; width: 100%; }

  .done { text-align: center; padding: .5rem 0; }
  .done .tick { width: 3.25rem; height: 3.25rem; margin: 0 auto 1rem; border-radius: 50%;
    background: var(--pearl-2); border: 1px solid var(--line); display: grid; place-items: center; }
  .done .tick svg { width: 1.4rem; height: 1.4rem; stroke: var(--olive-deep); }
  .summary { list-style: none; padding: 0; margin: 1.25rem 0; text-align: left; }
  .summary li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--line); }
  .summary li b { font-weight: 500; }
  .summary .yes { color: var(--olive); }
  .summary .no { color: var(--beige-deep); }

  .loading { min-height: 70vh; display: grid; place-items: center; color: var(--ink-soft); }


  .btn.submit { width: 100%; }
  fieldset.person { border: 0; margin: 0; padding-inline: 0; }
  .place { color: var(--ink); }
  .place h3 { color: var(--olive-deep); }

  /* Find-your-invite page */
  .findpage { text-align: center; padding: .5rem 0 2rem; }
  .findpage .names { margin-top: 1.5rem; }
  .findpage .when { font-family: var(--display); font-size: 1.5rem; color: var(--olive); margin: 1.25rem 0 .25rem; }
  .findpage .where { color: var(--ink-soft); }
  .find { text-align: left; margin-top: 2.5rem; background: var(--card); border: 1px solid var(--line); border-radius: 2rem; padding: 2rem 1.5rem; }
  .find h2 { font-size: 2rem; margin-bottom: .4rem; color: var(--olive); }
  .find p { color: var(--ink-soft); }
  .msg { margin: 1rem 0 0; }
  .matches { list-style: none; padding: 0; margin: .5rem 0 0; }
  .matches button { display: block; width: 100%; text-align: left; padding: .9rem 1rem; margin-top: .5rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--pearl); color: var(--ink); font-family: var(--display); font-size: 1.3rem; cursor: pointer; }

  /* ---------- Liquid-glass surfaces ---------- */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40rem 26rem at 110% 55%, rgba(220, 237, 200, .55), transparent 70%),
      radial-gradient(34rem 24rem at -10% 85%, rgba(216, 198, 168, .35), transparent 70%),
      radial-gradient(30rem 20rem at 50% 105%, rgba(241, 248, 233, .9), transparent 70%);
  }
  .place, .find, .rsvp, .btn, .lang {
    background: linear-gradient(140deg, rgba(255, 255, 255, .72) 0%, rgba(241, 248, 233, .5) 55%, rgba(241, 248, 233, .38) 100%);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, .85);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset 0 -1px 1px rgba(255, 255, 255, .35),
      inset 0 0 0 .5px rgba(94, 107, 58, .10),
      0 10px 30px -8px rgba(63, 72, 40, .14),
      0 1px 3px rgba(63, 72, 40, .06);
  }
  .place, .find, .rsvp { border-radius: 2rem; }
  .btn.ghost, .place .btn.ghost {
    background: linear-gradient(140deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .45));
    color: var(--olive-deep);
  }
  .btn:hover, .btn.ghost:hover, .place .btn.ghost:hover {
    background: linear-gradient(140deg, rgba(255, 255, 255, .95), rgba(241, 248, 233, .75));
    border-color: rgba(255, 255, 255, .95);
  }
  .btn:active { transform: scale(.98); }
  .lang button[aria-pressed="true"] {
    background: rgba(241, 248, 233, .95); color: var(--olive-deep);
    box-shadow: inset 0 1px 0 #fff, 0 1px 4px rgba(63, 72, 40, .14);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .place, .find, .rsvp, .btn, .lang { background: #f6faf0; }
  }


  /* ---------- Catch the bride ---------- */
  .game-block { margin: 4rem 0 0; text-align: center; }
  .game-block h2 { font-size: clamp(2rem, 8vw, 2.6rem); color: var(--olive); margin-bottom: .35rem; }
  .game-block .game-box { text-align: left; }
  .game-box { margin-top: 1.25rem; border-radius: 1.5rem; overflow: hidden; border: 1px solid rgba(255,255,255,.9);
    box-shadow: inset 0 1px 0 #fff, 0 10px 30px -8px rgba(63,72,40,.16); background: #fbfcf7; }
  .game-box canvas { display: block; touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .game-box canvas:focus-visible { outline: 2px solid var(--olive); outline-offset: -4px; }
  .how { font-style: italic; color: var(--beige-deep); margin: .5rem auto 0; max-width: 26rem; }

  .btn[disabled] { opacity: .6; }

</style>

<script>

window.G = {
  en: { playTitle: 'Catch the bride', playLead: 'Help Dirk catch Ané.', playHow: 'Tap to jump. Tap twice for a double jump.',
    tapStart: 'Tap to start', oops: 'Oops! Tap to try again', caught: 'Caught her! See you on 18 December', again: 'tap to play again',
    best: 'Best', score: 'Score', level: 'Level', board: 'Leaderboard', you: 'you', someone: 'Someone', boardEmpty: 'No scores yet. Be the first.', boardFail: 'Your score could not be added to the leaderboard.' },
  af: { playTitle: 'Vang die bruid', playLead: 'Help Dirk om Ané te vang.', playHow: "Tik om te spring. Tik twee keer vir 'n dubbelsprong.",
    tapStart: 'Tik om te begin', oops: 'Oeps! Tik om weer te probeer', caught: 'Gevang! Sien jou op 18 Desember', again: 'tik om weer te speel',
    best: 'Beste', score: 'Telling', level: 'Vlak', board: 'Ranglys', you: 'jy', someone: 'Iemand', boardEmpty: 'Nog geen tellings nie. Wees die eerste.', boardFail: 'Jou telling kon nie by die ranglys gevoeg word nie.' },
  nl: { playTitle: 'Vang de bruid', playLead: 'Help Dirk om Ané te vangen.', playHow: 'Tik om te springen. Tik twee keer voor een dubbele sprong.',
    tapStart: 'Tik om te starten', oops: 'Oeps! Tik om het opnieuw te proberen', caught: 'Gevangen! Tot 18 december', again: 'tik om opnieuw te spelen',
    best: 'Beste', score: 'Score', level: 'Level', board: 'Ranglijst', you: 'jij', someone: 'Iemand', boardEmpty: 'Nog geen scores. Wees de eerste.', boardFail: 'Je score kon niet aan de ranglijst worden toegevoegd.' },
};
// "Catch the bride": a small endless-runner with levels.
// Tap = jump, hold = higher, tap again in the air = double jump.
// Birds: low ones must be jumped, high ones you run under. Rings give points and close the gap.
window.mountGame = (canvas, text, hooks = {}) => {
  const ctx = canvas.getContext('2d');
  const H = 220, GROUND = 184, TARGET = 20, G = 1750;
  const C = {
    sky: '#fbfcf7', hillFar: '#dfe7d2', hillNear: '#cdd9bb', ground: '#d8c6a8', dot: '#bfa985',
    suit: '#2b2e24', shirt: '#ffffff', tie: '#4b5730', skin: '#e9c7a3', hairM: '#d9b86c',
    dress: '#ffffff', dressLine: '#e6e0d3', hairF: '#e3c27a', veil: 'rgba(255,255,255,.85)',
    bush: '#6f7d4a', bush2: '#8b9a62', protea: '#e3a6a1', barrel: '#8a5f3a', hoop: '#4e3a26', rock: '#b8ab92',
    bird: '#4a4a52', birdDot: '#e9e6e0', ring: '#c9a24a', ink: '#141414', olive: '#4b5730', heart: '#c9605f',
  };
  let W = 360, dpr = 1;
  let state = 'idle';                 // idle | run | over | won
  let t = 0, speed = 0, dist = 0, cleared = 0, rings = 0, score = 0, spawnIn = 0, elapsed = 0, wonT = 0;
  let obstacles = [], pickups = [], floats = [], hearts = [], raf = 0, last = 0, holding = false, holdT = 0;
  const groom = { x: 46, y: 0, vy: 0, w: 18, h: 42, jumps: 0 };
  const bride = { x: 0, y: 0, vy: 0, w: 22, h: 42 };
  const best = () => parseInt(store.get('troufees:best') || '0', 10) || 0;
  const level = () => cleared < 5 ? 1 : cleared < 11 ? 2 : 3;

  function resize() {
    W = Math.max(280, Math.round(canvas.parentElement.clientWidth));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state !== 'run') { placeBride(); draw(); }
  }
  const startGap = () => Math.min(W * .5, 230);
  const progress = () => Math.min(1, (cleared + rings * .5) / TARGET);
  const gapNow = () => startGap() * (1 - progress());
  function placeBride() { bride.x = groom.x + 34 + gapNow(); }

  function reset() {
    t = 0; dist = 0; cleared = 0; rings = 0; score = 0; elapsed = 0; wonT = 0; speed = 250; spawnIn = 1.1;
    obstacles = []; pickups = []; floats = []; hearts = [];
    Object.assign(groom, { x: 46, y: 0, vy: 0, jumps: 0 }); bride.y = 0; bride.vy = 0;
    placeBride();
  }

  function press() {
    if (state !== 'run') { reset(); state = 'run'; loop(); return; }
    holding = true; holdT = 0;
    if (groom.y === 0) { groom.vy = 560; groom.jumps = 1; }
    else if (groom.jumps < 2) { groom.vy = 470; groom.jumps = 2; }
  }
  function release() { holding = false; if (state === 'run' && groom.vy > 230 && groom.jumps === 1) groom.vy = 230; }

  function spawn() {
    const lv = level();
    const pool = ['bush', 'barrel', 'rock'];
    if (lv >= 2) pool.push('double', 'double');
    if (lv >= 3) pool.push('birdLow', 'birdHigh', 'birdHigh');
    const k = pool[Math.floor(Math.random() * pool.length)];
    let o;
    if (k === 'barrel') o = { w: 20, h: 26, lift: 0 };
    else if (k === 'rock') o = { w: 22, h: 14, lift: 0 };
    else if (k === 'double') o = { w: 54, h: 26, lift: 0 };
    else if (k === 'birdLow') o = { w: 26, h: 14, lift: 30 };
    else if (k === 'birdHigh') o = { w: 26, h: 14, lift: 60 };
    else o = { w: 24 + Math.random() * 8, h: 20 + Math.random() * 8, lift: 0 };
    obstacles.push({ k, x: W + 20, ...o, passed: false, brideJumped: false, flap: Math.random() * 6 });
    if (lv >= 2 && Math.random() < .45) pickups.push({ x: W + 20 + o.w / 2 + (Math.random() < .5 ? 0 : 90), lift: 78 + Math.random() * 18, got: false });
    const minGap = k === 'double' ? 1.05 : 0.85;
    spawnIn = minGap * (290 / speed) + Math.random() * .7 + .2;
  }

  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function step(dt) {
    t += dt;
    if (state === 'run') {
      elapsed += dt;
      speed = Math.min(250 + elapsed * 7 + (level() - 1) * 25, 520);
      dist += speed * dt;
      spawnIn -= dt; if (spawnIn <= 0) spawn();
    } else if (state === 'won') {
      wonT += dt; speed = Math.max(0, speed - 600 * dt);
      if (groom.x < bride.x - 20) groom.x += 90 * dt;
      if (wonT < 2.5 && Math.random() < dt * 9) hearts.push({ x: (groom.x + bride.x) / 2 + 10, y: GROUND - 60, vy: -30 - Math.random() * 30, vx: (Math.random() - .5) * 40, life: 1.6 });
    }
    for (const o of obstacles) o.x -= speed * dt;
    for (const p of pickups) p.x -= speed * dt;
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    pickups = pickups.filter(p => p.x > -20 && !p.got);

    for (const o of obstacles) {
      if (o.k === 'birdHigh' || o.brideJumped) continue;
      if (o.x - (bride.x + bride.w) < speed * 0.1 && o.x > bride.x - o.w) { if (bride.y === 0) bride.vy = o.k === 'double' || o.k === 'birdLow' ? 560 : 480; o.brideJumped = true; }
    }
    if (holding && groom.jumps === 1) { holdT += dt; if (holdT < .2) groom.vy += G * .55 * dt; }
    for (const who of [groom, bride]) {
      if (who.y > 0 || who.vy > 0) { who.vy -= G * dt; who.y = Math.max(0, who.y + who.vy * dt); if (who.y === 0) { who.vy = 0; if (who === groom) groom.jumps = 0; } }
    }

    if (state === 'run') {
      const gBox = { x: groom.x + 4, y: GROUND - groom.h - groom.y + 3, w: groom.w - 8, h: groom.h - 3 };
      for (const o of obstacles) {

// ---------- Talking to the Google Sheet ----------
async function call(action, extra) {
  const body = JSON.stringify({ action, code: CODE, lang, ua: navigator.userAgent.slice(0, 200), ...extra });
  if (!API) return demo(action, extra);
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
  if (!res.ok) throw new Error('http ' + res.status);
  return res.json();
}
function track(action, extra) {          // fire-and-forget (survives the page opening a new tab)
  if (!API) return;
  const body = JSON.stringify({ action, code: (me && me.code) || CODE, name: me && me.name, lang, ua: navigator.userAgent.slice(0, 200), ...extra });
  try { fetch(API, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); } catch {}
}
// Before the sheet is connected: accept any full name so the page can be tried out.
function demo(action, extra) {
  if (action !== 'verify') return { ok: true };
  const first = extra.name.trim().split(/\s+/)[0];
  return { ok: true, code: CODE || 'demo', greeting: first, names: [extra.name.trim()], lang };
}

// ---------- Rendering ----------
function setLangButtons() {
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
}
function render() {
  setLangButtons();
  if (me) renderInvite(); else renderGate();
  const scene = $('.scene');
  if (scene && !firstPaint) scene.style.animation = 'none';
  firstPaint = false;
}

function renderGate(msg) {
  if (window.__game) { window.__game.destroy(); window.__game = null; }
  const t = T[lang], n = N[lang];
  $('#app').innerHTML = `<div class="findpage">
    <img class="scene" src="/chapel.webp" alt="${SCENE_ALT[lang]}">
    <h1 class="names">${esc(SITE.couple.first)}<span class="amp">&amp;</span>${esc(SITE.couple.second)}</h1>
    <p class="when">${fmtDate(SITE.date, lang)}</p>
    <p class="where">${esc(SITE.venue.name)}, ${esc(SITE.venue.town)}, ${t.country}</p>
    <section class="find">
      <h2>${n.welcome}</h2><p>${n.gateLead}</p>
      <form id="gate" novalidate>
        <label class="field"><span>${n.nameLabel}</span><input id="fname" name="name" autocomplete="name" autocapitalize="words" required></label>
        <p class="error" id="err" role="alert" ${msg ? '' : 'hidden'}>${msg ? esc(msg) : ''}</p>
        <button class="btn submit" type="submit" id="go">${n.open}</button>
      </form>
    </section></div>`;
  $('#footer').innerHTML = '';
  $('#gate').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#fname').value.trim().replace(/\s+/g, ' ');
    const err = $('#err'), go = $('#go');
    if (name.split(' ').length < 2) { err.textContent = n.needBoth; err.hidden = false; return; }
    err.hidden = true; go.disabled = true; go.textContent = n.checking;
    try {
      const r = await call('verify', { name });
      if (!r.ok) { err.textContent = n.noMatch; err.hidden = false; go.disabled = false; go.textContent = n.open; return; }
      me = { code: r.code, greeting: r.greeting, names: r.names, lang: r.lang || lang, name: r.name || name };
      store.set(KEY, JSON.stringify(me));
      if (r.code) store.set('troufees:' + r.code, JSON.stringify(me));
      if (!store.get('lang') && r.lang) lang = r.lang;
      if (r.code && r.code !== CODE && API) history.replaceState(null, '', '/g/' + r.code);   // typed their name on the home page
      render(); scrollTo(0, 0);
    } catch {
      err.textContent = n.failed; err.hidden = false; go.disabled = false; go.textContent = n.open;
    }
  });
}

function daysUntil(iso) { return Math.ceil((new Date(`${iso}T00:00:00+02:00`).getTime() - Date.now()) / 86400000); }

function calendarLinks() {
  const { first: a, second: b } = SITE.couple, v = SITE.venue;
  const d = SITE.date.replace(/-/g, '');
  const next = new Date(`${SITE.date}T12:00:00Z`); next.setUTCDate(next.getUTCDate() + 1);
  const end = next.toISOString().slice(0, 10).replace(/-/g, '');
  const title = `${a} & ${b} – wedding`, where = `${v.name}, ${v.town}, ${v.region}`;
  const google = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + `&text=${encodeURIComponent(title)}&dates=${d}/${end}&location=${encodeURIComponent(where)}`;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Stoffberg Troufees//EN', 'BEGIN:VEVENT',
    `UID:troufees-${d}@stoffbergtroufees.com`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}`,
    `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`, `SUMMARY:${title}`, `LOCATION:${where.replace(/,/g, '\\,')}`,
    'END:VEVENT', 'END:VCALENDAR', ''].join('\r\n');
  return { google, ics: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics) };
}
const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

function renderInvite() {
  const t = T[lang];
  const { first: a, second: b } = SITE.couple;
  const v = SITE.venue;
  const days = daysUntil(SITE.date);
  const maps = encodeURIComponent(v.mapsQuery);
  const cal = calendarLinks();

  $('#app').innerHTML = `
    <section class="hero" id="top">
      <img class="scene" src="/chapel.webp" alt="${SCENE_ALT[lang]}">
      <p class="dear">${t.dear} ${esc(me.greeting)},</p>
      <p class="std">${t.saveTheDate}</p>
      <h1 class="names">${esc(a)}<span class="amp">&amp;</span>${esc(b)}</h1>
      <p class="date" aria-label="${fmtDate(SITE.date, lang)}">${fmtDate(SITE.date, lang).split(' ').map(esc).join('<i></i>')}</p>
      <p class="where">${esc(v.name)}, ${esc(v.town)}, ${t.country}</p>
      <p class="lead">${t.gettingMarried}</p>
      ${days >= 0 ? `<p class="countdown">${days === 0 ? t.today : t.daysToGo(days)}</p>` : ''}
      <div class="actions">
        <a class="btn" id="cal" href="${isApple ? cal.ics : cal.google}" ${isApple ? 'download="ane-en-dirk.ics"' : 'target="_blank" rel="noopener"'}>${icon.cal}${t.addCalendar}</a>
      </div>
    </section>

    <section class="place" aria-label="${t.thePlace}">
      <h3>${esc(v.name)}</h3>
      <p class="town">${esc(v.town)}, ${t.region}</p>
      <p>${t.placeNote}</p>
      <div class="actions">
        <a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=${maps}" target="_blank" rel="noopener">${icon.pin}${t.googleMaps}</a>
        <a class="btn ghost" href="https://maps.apple.com/?q=${maps}" target="_blank" rel="noopener">${icon.pin}${t.appleMaps}</a>
      </div>
    </section>
    <p class="later">${t.detailsFollow}</p>
    <p class="later">${t.celebrate}</p>

    <section class="game-block" id="play" aria-labelledby="play-h">
      <h2 id="play-h">${G[lang].playTitle}</h2>
      <p class="how">${G[lang].playLead} ${G[lang].playHow}</p>
      <div class="game-box"><canvas id="game" tabindex="0" aria-label="${G[lang].playTitle}. ${G[lang].playHow}"></canvas></div>
    </section>`;

  $('#footer').innerHTML = `<p>${t.remembered}</p><button type="button" id="notme">${N[lang].notYou}</button>`;
  $('#notme').onclick = () => { store.del(KEY); me = null; render(); scrollTo(0, 0); };
  $('#cal').addEventListener('click', () => track('calendar'));
  if (window.__game) window.__game.destroy();
  window.__game = mountGame($('#game'), () => G[lang]);
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('lang', lang); render(); });
render();
if (me) track('open');        // returning visitor on a remembered phone

</script>
</body>
</html>
